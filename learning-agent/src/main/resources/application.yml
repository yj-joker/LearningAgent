mybatis:
  mapper-locations: classpath*:/Mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
spring:
  servlet:
    multipart:
      #如果文件大小超过10MB，则写入磁盘，否则进入内存 。如果并发量大，最好的方式是直接写入MinIO
      file-size-threshold: 10MB
      #单个文件最大500MB
      max-file-size: 500MB
      #一次请求最大处理500MB
      max-request-size: 500MB
  config:
    import: "optional:file:./.env[.properties]"
  application:
    name: learning-agent
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    #接口文档访问路径
    #Swagger UI:  http://localhost:8080/swagger-ui/index.html
    #OpenAPI JSON: http://localhost:8080/v3/api-docs
    #OpenAPI YAML: http://localhost:8080/v3/api-docs.yaml
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: false
  api-docs:
    enabled: false
jwt:
  secret: ${JWT_SECRET}
  expiration-millis: ${JWT_EXPIRATION_MILLIS}
minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  # 认证信息必须由环境变量或本地 .env 提供，避免误用默认管理员账号。
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET:document-bucket}


snowflake:
  # 本地单实例可以使用 0；
  #TODO  多实例部署时，每个同时运行的实例必须配置不同的值。
  worker-id: ${SNOWFLAKE_WORKER_ID:0}

aliyun:
  debug:
    timeout-second: ${ALIYUN_DEBUG_TIMEOUT_SECOND:10}
  embedding:
    # API Key 通过环境变量或 .env 注入，不要写入源码。
    api-key: ${ALIYUN_EMBEDDING_API_KEY:}
    base-url: ${ALIYUN_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/embeddings}
    model: ${ALIYUN_EMBEDDING_MODEL:qwen3.7-text-embedding}
    dimensions: ${ALIYUN_EMBEDDING_DIMENSIONS:1536}
    # 单次请求最多发送的文本数量，qwen3.7 系列当前建议不超过 20
    max-batch-size: ${ALIYUN_EMBEDDING_MAX_BATCH_SIZE:20}
    # 单实例同时调用阿里云 Embedding 接口的最大请求数
    max-concurrency: ${ALIYUN_EMBEDDING_MAX_CONCURRENCY:2}
    # 等待并发许可的最长时间，单位秒
    acquire-timeout-seconds: ${ALIYUN_EMBEDDING_ACQUIRE_TIMEOUT_SECONDS:30}
    # 建立 TCP 和 TLS 连接的最长等待时间，单位秒
    connect-timeout-seconds: ${ALIYUN_EMBEDDING_CONNECT_TIMEOUT_SECONDS:5}
    # 连接成功后等待响应数据的最长时间，单位秒
    read-timeout-seconds: ${ALIYUN_EMBEDDING_READ_TIMEOUT_SECONDS:60}
  llm:
    # 优先读取聊天模型专用 Key；没有配置时回退到 Embedding Key，便于同一阿里云账号复用凭证。
    # API Key 只存放在环境变量或本地 .env 中，不能直接写进这个会提交到 Git 的配置文件。
    api-key: ${ALIYUN_LLM_API_KEY:${ALIYUN_EMBEDDING_API_KEY:}}
    # OpenAI 兼容的聊天完成接口完整地址，测试时也可以通过环境变量替换成本地地址。
    base-url: ${ALIYUN_LLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
    # 默认模型使用稳定别名；更换模型只需要修改环境变量，不需要重新修改 Java 客户端。
    model: ${ALIYUN_LLM_MODEL:qwen-plus}
    # 分别限制建立连接和等待模型生成结果的最长时间，避免请求线程无限期阻塞。
    connect-timeout-seconds: ${ALIYUN_LLM_CONNECT_TIMEOUT_SECONDS:5}
    read-timeout-seconds: ${ALIYUN_LLM_READ_TIMEOUT_SECONDS:60}

harness:
  context:
    # 当前测试阶段用字符数近似上下文大小，不等于模型厂商统计的真实 token 数。
    max-context-characters: ${HARNESS_MAX_CONTEXT_CHARACTERS:2000}
    # 工具结果正文超过 500 个字符时，只压缩发送给模型的工作副本。
    max-tool-result-characters: ${HARNESS_MAX_TOOL_RESULT_CHARACTERS:500}
    # 单次 Agent Loop 最多执行两次原始工具结果恢复，避免模型反复读取。
    max-recovery-calls-per-run: ${HARNESS_MAX_RECOVERY_CALLS_PER_RUN:2}
    # 所有成功恢复结果的累计字符上限。
    max-recovery-characters-per-run: ${HARNESS_MAX_RECOVERY_CHARACTERS_PER_RUN:600}
    # 恢复结果加入后最多占用 95% 上下文；超限时先返回失败，强制压缩留到下一阶段。
    recovery-safe-context-ratio: ${HARNESS_RECOVERY_SAFE_CONTEXT_RATIO:0.95}
milvus:
  host: ${MILVUS_HOST:127.0.0.1}
  port: ${MILVUS_PORT:19530}
  timeout: ${MILVUS_TIMEOUT:10000}

document:
  task:
    scheduler:
      # 解析任务提交间隔，单位毫秒
      fixed-delay-ms: ${DOCUMENT_TASK_SCHEDULER_FIXED_DELAY_MS:1000}
